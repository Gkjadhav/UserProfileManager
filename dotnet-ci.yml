name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build src/UserProfileManager/UserProfileManager.csproj --no-restore --configuration Release

      - name: Build tests
        run: dotnet build tests/UserProfileManager.Tests/UserProfileManager.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test tests/UserProfileManager.Tests/UserProfileManager.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"